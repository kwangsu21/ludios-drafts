<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUDIOS 홈페이지 시안</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌹</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#f6f1ea;--ink:#2b211c;--mut:#6d615a;--line:#e3d9ce}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",system-ui,sans-serif;line-height:1.6}
.wrap{width:min(100% - 32px,960px);margin:0 auto;padding:56px 0}
h1{font-size:clamp(24px,4vw,34px);margin:0 0 6px;letter-spacing:-.02em}
p{color:var(--mut);margin:0 0 32px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
a.card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:transform .3s,box-shadow .3s}
a.card:hover{transform:translateY(-4px);box-shadow:0 20px 40px -24px rgba(60,30,10,.4)}
.card img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.card div{padding:16px 18px}
.card b{display:block;font-size:17px}
.card span{font-size:13px;color:var(--mut)}
.soon{border:1px dashed var(--line);border-radius:18px;display:grid;place-items:center;min-height:220px;color:var(--mut);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>LUDIOS PGR-38 · 홈페이지 시안</h1>
  <p>마음에 드는 시안을 선택해 주세요. 모든 시안은 PC·모바일 반응형입니다.</p>
  <div class="grid">
    <a class="card" href="draft-01/"><img src="assets/img/hero-set.webp" alt=""><div><b>시안 A · Rose Gold Atelier</b><span>아이보리 × 로즈골드, 에디토리얼 럭셔리</span></div></a>
    <a class="card" href="draft-02/"><img src="assets/img/lineup.webp" alt="" style="object-position:50% 40%"><div><b>시안 B · Pure White Lab</b><span>퓨어 화이트 × 블랙 라인 × 레드 포인트, 클린 미니멀</span></div></a>
    <div class="soon">시안 C 준비 중</div>
  </div>
</div>
</body>
</html>
